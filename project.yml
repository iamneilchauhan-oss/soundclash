# XcodeGen spec — generates the .xcodeproj on CI (it's gitignored locally).
# Used by .github/workflows/snapshots.yml to render true 1:1 design snapshots
# of every screen on a macOS runner. Generate locally with `xcodegen generate`
# if you ever need the project file outside Xcode's own scaffolding.
name: SoundClash
options:
  bundleIdPrefix: com.neilchauhanpersonalteam
  deploymentTarget:
    iOS: "17.0"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.17.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.3

targets:
  SoundClash:
    type: application
    platform: iOS
    sources:
      - path: ios/SoundClash
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.neilchauhanpersonalteam.SoundClash
      INFOPLIST_KEY_NSAppleMusicUsageDescription: "SoundClash plays battle tracks from your Apple Music subscription."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "SoundClash uses your mic so competitors and judges can talk live."
      INFOPLIST_KEY_UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Supabase
        product: Supabase

  SoundClashSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/SnapshotTests
    dependencies:
      - target: SoundClash

schemes:
  SoundClash:
    build:
      targets:
        SoundClash: [run, test, archive]
        SoundClashSnapshots: [test]
    test:
      config: Debug
      targets:
        - SoundClashSnapshots
